  <style>
    :root {
      --primary-color: #FFD740;
      --secondary-color: #FF4081;
      --win-color: #28a745;
      --loss-color: #dc3545;
      --bg-glass: rgba(24, 255, 255, 0.1);

    }

    body {
      margin: 0;
      padding: 0;
      background:const CURRENT_API = 'https://api.bdg88zf.com/api/webapi/GetGameIssue';
    const HISTORY_API = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';
no-repeat center center fixed;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
      color: var(--primary-color);
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;

      justify-content: center;
    }

    body::before {
      content: "";

    .container {
      max-width: 420px;

    /* --- LOGIN PAGE STYLES --- */
    #login-container {
        text-align: center;
    }

    .login-card {
        background: var(--bg-glass);

        -webkit-backdrop-filter: blur(10px);

    }
    
    .login-title {
        font-family: 'Orbitron', sans-serif;

    }

    .input-group {

    .login-input {
        width: 100%;

    .watermark {

    .card {
      background: var(--bg-glass);

    .period-label {

    #countdown {

    .period-input {
      width: 100%;

      border-radius: 8px;

    .result-section {
      display: flex;

    .big-text {

    .dashboard-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--secondary-color);
      padding-bottom: 5px;

    }

    .dashboard-title::after {
      content: "";
      position: absolute;
      bottom: -2px;

      background: linear-gradient(90deg, transparent, var(--secondary-color), transparent);
    }

    .info-row {
      display: flex;
      justify-content: space-between;

      transition: background 0.3s;
    }
    
    .info-row span:first-child { font-weight: 600; }
    .info-row span:last-child { font-weight: bold; font-family: 'Orbitron', sans-serif; }
    .info-row:last-child { border-bottom: none; }
    .info-row:hover { background: rgba(255, 215, 64, 0.05); }

    #accuracy.win { color: var(--win-color); }
    #accuracy.loss { color: var(--loss-color); }

    .connected {
      color: #28a745;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(40,167,69,0.5);
    }

    .footer {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      margin-top: 30px;
      color: var(--primary-color);
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
    }

    .history-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 30px;
      color: var(--primary-color);
      text-align: center;
      position: relative;
    }

    .history-title::before, .history-title::after {
      content: "✦";
      margin: 0 10px;
      color: var(--secondary-color);
    }

    .history-card {
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      color: #eee;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: transform 0.3s, box-shadow 0.3s;
      border-left: 5px solid #9E9E9E;
      background: rgba(158, 158, 158, 0.1);
    }
    .history-card .period { font-weight: bold; font-family: 'Orbitron', sans-serif; }
    .history-card .prediction-details { font-size: 14px; color: #ccc; }
    .history-card .result { font-weight: bold; font-family: 'Orbitron', sans-serif;}

    .history-card.win {
        border-left-color: var(--win-color);
        background: rgba(40, 167, 69, 0.15);
    }
    .history-card.loss {
        border-left-color: var(--loss-color);
        background: rgba(220, 53, 69, 0.15);
    }
    .history-card .result.win-text { color: var(--win-color); text-shadow: 0 0 5px var(--win-color); }
    .history-card .result.loss-text { color: var(--loss-color); text-shadow: 0 0 5px var(--loss-color); }

    .history-actions i {
      margin-left: 15px;
      font-size: 18px;
      cursor: pointer;
      color: #ccc;
      transition: transform 0.3s, color 0.3s;
    }

    .history-actions i:hover {
      transform: scale(1.2);
    }
    
    .history-actions .fa-trash-alt:hover {
        color: var(--secondary-color);
    }

    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .win-icon { animation: bounce 0.8s ease-in-out infinite; color: var(--win-color); }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

    .loss-icon { animation: shake 0.5s ease-in-out infinite; color: var(--loss-color); }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 50% { transform: translateX(3px); } 75% { translateX(-3px); } }

    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 215, 64, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(255, 215, 64, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 215, 64, 0); }
    }
  </style>

<body>

  <div class="container">

    <!-- LOGIN PAGE -->
    <div id="login-container">
        <div class="login-card">
            <div class="login-title">𝙕𝙀𝙉𝙊𝙓  𝙋𝙑𝙏 𝙋𝘼𝙉𝙀𝙇</div>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" class="login-input" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="login-input" placeholder="Password" required>
            </div>
            <button id="login-btn">Login</button>
            <p id="login-error"></p>
        </div>
    </div>
    
    <!-- MAIN APPLICATION -->
    <div id="main-container">
      <div class="watermark">𝙕𝙀𝙉𝙊𝙓  𝙋𝙑𝙏 𝙋𝘼𝙉𝙀𝙇</div>
      
      <div class="wrapper">
        <a href="https://t.me/+ruB7-whLblQwZTI1" class="join-btn" target="_blank">
          <i class="fab fa-telegram"></i> Join Channel
        </a>
        <svg>
          <text x="50%" y="50%" dy=".35em" text-anchor="middle">𝙕𝙀𝙉𝙊𝙓  𝙋𝙑𝙏 𝙋𝘼𝙉𝙀𝙇</text>
        </svg>
      </div>

      <div class="card pulse" id="predictionCard">
        <div class="period-label">
            <div><i class="fa-solid fa-calendar-days"></i> Period</div>
            <div id="countdown">00:00</div>
        </div>
        <input type="text" id="periodDisplay" class="period-input" value="-" readonly>
        <div class="result-section">
          <span><i class="fa-solid fa-chart-bar"></i> Prediction</span>
          <span class="big-text" id="predictionDisplay">--</span>
          <span class="single-number" id="oppositeNumberDisplay">--</span>
        </div>
      </div>

      <div class="card">
        <div class="dashboard-title">Analysis Dashboard</div>
        <div class="info-row">
          <span><i class="fa-solid fa-percent"></i> Win Rate</span>
          <span id="accuracy">0%</span>
        </div>
        <div class="info-row">
          <span><i class="fa-solid fa-trophy"></i> Wins</span>
          <span id="wins">0</span>
        </div>
        <div class="info-row">
          <span><i class="fa-solid fa-skull-crossbones"></i> Loss</span>
          <span id="losses">0</span>
        </div>
        <div class="info-row">
          <span><i class="fa-solid fa-server"></i> Server Status</span>
          <span class="connected">Connected <i class="fas fa-circle" style="font-size: 8px;"></i></span>
        </div>
      </div>

      <div class="footer">Powered by  PHX Algorithm</div>

      <div class="history-title">Prediction History</div>
      <div id="historyContainer">
          <!-- History will be dynamically inserted here -->
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // --- DOM ELEMENTS ---
    const loginContainer = document.getElementById('login-container');
    const mainContainer = document.getElementById('main-container');
    const loginBtn = document.getElementById('login-btn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('login-error');

    const periodDisplay = document.getElementById('periodDisplay');
    const countdownDisplay = document.getElementById('countdown');
    const predictionDisplay = document.getElementById('predictionDisplay');
    const oppositeNumberDisplay = document.getElementById('oppositeNumberDisplay');
    const accuracyDisplay = document.getElementById('accuracy');
    const winsDisplay = document.getElementById('wins');
    const lossesDisplay = document.getElementById('losses');
    const historyContainer = document.getElementById('historyContainer');
    const predictionCard = document.getElementById('predictionCard');

    // --- STATE MANAGEMENT ---
    let wins = 0;
    let losses = 0;
    let history = [];
    const PERIOD_DURATION = 180; // 3 minutes in seconds
    let currentPeriodId = null;
    let timerInterval = null;

    // --- LOGIN LOGIC (UPDATED) ---
    loginBtn.addEventListener('click', () => {
        // Correct credentials
        const correctUsername = 'HACK24+546784';
        const correctPassword = 'HACK24+546784';

        // Get user input and remove extra spaces
        const enteredUsername = usernameInput.value.trim();
        const enteredPassword = passwordInput.value.trim();

        // Check if the entered details match the correct ones
        if (enteredUsername === correctUsername && enteredPassword === correctPassword) {
            // If correct, hide login and show main app
            loginContainer.style.display = 'none';
            mainContainer.style.display = 'block';
            initializeApp();
        } else {
            // If incorrect, show an error message
            loginError.textContent = 'Incorrect Username or Password.';
            // Clear the error message after 3 seconds
            setTimeout(() => {
                loginError.textContent = '';
            }, 3000);
        }
    });
    
    // --- INITIALIZATION ---
    function initializeApp() {
        loadState();
        startTimer();
        updateDashboardUI();
        renderHistory();
        
        // Initial check in case the page loads mid-period
        const timeWithinPeriod = Math.floor(Date.now() / 1000) % PERIOD_DURATION;
        const newPeriodId = calculatePeriodId();
        if (currentPeriodId !== newPeriodId) {
             handleNewPeriod(newPeriodId);
        }
    }

    // --- CORE TIMER AND PERIOD LOGIC ---
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        const timeWithinPeriod = Math.floor(Date.now() / 1000) % PERIOD_DURATION;
        const remainingTime = PERIOD_DURATION - timeWithinPeriod;
        
        const minutes = Math.floor(remainingTime / 60).toString().padStart(2, '0');
        const seconds = (remainingTime % 60).toString().padStart(2, '0');
        countdownDisplay.textContent = `${minutes}:${seconds}`;

        const newPeriodId = calculatePeriodId();
        if (currentPeriodId !== newPeriodId) {
            handleNewPeriod(newPeriodId);
        }
    }
    
    function handleNewPeriod(newPeriodId) {
        // 1. Resolve the *previous* period's result
        if (history.length > 0 && history[0].status === 'waiting') {
            const lastPrediction = history[0];
            const actualResultNumber = Math.floor(Math.random() * 10);
            const actualResultType = actualResultNumber >= 5 ? 'BIG' : 'SMALL';

            lastPrediction.result = { number: actualResultNumber, type: actualResultType };
            if (lastPrediction.prediction.type === actualResultType) {
                lastPrediction.status = 'win';
                wins++;
            } else {
                lastPrediction.status = 'loss';
                losses++;
            }
        }

        // 2. Generate a *new* prediction for the current period
        currentPeriodId = newPeriodId;
        const newPrediction = generatePrediction();
        
        history.unshift({
            periodId: currentPeriodId,
            prediction: newPrediction,
            status: 'waiting', // This will be resolved in the next cycle
            result: null
        });

        // 3. Update UI and save state
        updatePredictionUI(newPrediction);
        periodDisplay.value = currentPeriodId;
        updateDashboardUI();
        renderHistory();
        saveState();

        // Add pulse effect to new prediction
        predictionCard.classList.add('pulse');
        setTimeout(() => predictionCard.classList.remove('pulse'), 2000);
    }

    // --- PREDICTION LOGIC ---
    function generatePrediction() {
        const isBig = Math.random() < 0.5;
        const type = isBig ? 'BIG' : 'SMALL';
        const oppositeNumber = isBig ? Math.floor(Math.random() * 5) : 5 + Math.floor(Math.random() * 5);
        return { type, oppositeNumber };
    }

    // --- UI UPDATE FUNCTIONS ---
    function updatePredictionUI(prediction) {
        predictionDisplay.textContent = prediction.type;
        oppositeNumberDisplay.textContent = prediction.oppositeNumber;
    }

    function updateDashboardUI() {
        winsDisplay.textContent = wins;
        lossesDisplay.textContent = losses;
        const total = wins + losses;
        if (total === 0) {
            accuracyDisplay.textContent = '0%';
            accuracyDisplay.className = '';
        } else {
            const rate = Math.round((wins / total) * 100);
            accuracyDisplay.textContent = `${rate}%`;
            accuracyDisplay.className = rate >= 50 ? 'win' : 'loss';
        }
    }

    function renderHistory() {
        historyContainer.innerHTML = '';
        history.forEach((item, index) => {
            const card = document.createElement('div');
            card.classList.add('history-card');

            let statusIcon = '<i class="fa fa-spinner spinner"></i>';
            let resultText = 'Waiting...';
            
            if (item.status === 'win') {
                card.classList.add('win');
                statusIcon = '<i class="fa-solid fa-trophy win-icon"></i>';
                resultText = `<span class="result win-text">WIN</span> - Result: ${item.result.number} (${item.result.type})`;
            } else if (item.status === 'loss') {
                card.classList.add('loss');
                statusIcon = '<i class="fa-solid fa-skull-crossbones loss-icon"></i>';
                resultText = `<span class="result loss-text">LOSS</span> - Result: ${item.result.number} (${item.result.type})`;
            }

            card.innerHTML = `
                <div style="flex: 1;">
                    <div class="period"><i class="fa-solid fa-calendar"></i> P-${item.periodId}</div>
                    <div class="prediction-details"><i class="fa fa-chart-bar"></i> ${item.prediction.type} | <i class="fa fa-retweet"></i> ${item.prediction.oppositeNumber}</div>
                    <div><i class="fa fa-dice"></i> ${resultText}</div>
                </div>
                <div class="history-actions">
                    ${statusIcon}
                    <i class="fa-solid fa-trash-alt" onclick="deleteHistoryItem(${index})"></i>
                </div>
            `;
            historyContainer.appendChild(card);
        });
    }

    // --- HELPER & DATA PERSISTENCE FUNCTIONS ---
    function calculatePeriodId() {
        const now = new Date();
        const year = now.getFullYear();
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const day = now.getDate().toString().padStart(2, '0');
        const periodsInDay = Math.floor((now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / PERIOD_DURATION);
        return `${year}${month}${day}-${periodsInDay.toString().padStart(3, '0')}`;
    }

    function saveState() {
        const state = { wins, losses, history: history.slice(0, 50) }; // Save last 50 items
        localStorage.setItem('tradeGeniusState', JSON.stringify(state));
    }

    function loadState() {
        const savedState = localStorage.getItem('tradeGeniusState');
        if (savedState) {
            const state = JSON.parse(savedState);
            wins = state.wins || 0;
            losses = state.losses || 0;
            history = state.history || [];
            // Set the current period from the last saved history item
            if (history.length > 0) {
                 currentPeriodId = history[0].periodId;
                 updatePredictionUI(history[0].prediction);
                 periodDisplay.value = currentPeriodId;
            }
        }
    }
    
    // Make delete function globally accessible for onclick attribute
    window.deleteHistoryItem = (index) => {
        // Be careful when deleting, recalculate wins/losses if needed
        const item = history[index];
        if (item.status === 'win') wins--;
        if (item.status === 'loss') losses--;

        history.splice(index, 1);
        saveState();
        renderHistory();
        updateDashboardUI();
    };
});
</script>

</body>
